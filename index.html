
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#151e34;text-align:center}
h1{margin:0;color:#60ddff;font-size:27px}
.subtitle{font-size:12px;color:#aabbd3;margin-top:8px}
main{padding:16px;max-width:700px;margin:auto}
.summary{background:#19253e;border-radius:16px;padding:20px;margin-bottom:18px}
.number{font-size:32px;font-weight:bold;color:#60ddff}
.progress{height:9px;background:#34425b;border-radius:20px;overflow:hidden;margin-top:12px}
.fill{height:100%;background:#60ddff;width:0}
input{width:100%;padding:14px;background:#1c2942;color:white;border:1px solid #455574;border-radius:10px;font-size:16px;margin-bottom:14px}
.filters{display:flex;gap:8px;margin-bottom:20px}
.filters button{flex:1;padding:11px 4px;border:1px solid #42536d;background:#1c2942;color:white;border-radius:9px}
.filters .selected{background:#60ddff;color:#07111c;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#1b2942;border:1px solid #354762;border-radius:14px;overflow:hidden}
.picture{height:155px;background:radial-gradient(circle,#334f77,#111b30);display:flex;align-items:center;justify-content:center}
.picture img{width:100%;height:100%;object-fit:contain}
.picture.missing img{filter:grayscale(1);opacity:.4}
.details{padding:12px}
.name{font-weight:bold;font-size:14px;min-height:35px;overflow-wrap:anywhere}
.level{font-size:12px;color:#b9cce4;margin:9px 0}
.controls{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.controls button{background:#344966;color:white;border:0;border-radius:7px;padding:7px 12px}
.own{width:100%;padding:10px;border:0;border-radius:8px;background:#60ddff;color:#081320;font-weight:bold}
.own.yes{background:#304e48;color:#83ffd2}
.notice{font-size:13px;color:#b9cce4;text-align:center;padding:18px}
</style>
</head>
<body>
<header>
<h1>✦ SPRITE TRACKER</h1>
<div class="subtitle">Your Fortnite Sprite Collection</div>
</header>
<main>
<section class="summary">
<div>My Collection</div>
<div class="number" id="count">0 / 0</div>
<div class="progress"><div class="fill" id="fill"></div></div>
</section>
<input id="search" placeholder="Search Sprites...">
<div class="filters">
<button class="selected" data-filter="all">All</button>
<button data-filter="owned">Owned</button>
<button data-filter="missing">Missing</button>
</div>
<div id="status" class="notice">Loading Sprite artwork...</div>
<div class="grid" id="grid"></div>
<div class="notice">
Manual tracking for now. Epic account syncing is not connected.
</div>
</main>
<script>
const API="https://prod.fn-api.cc/v1/sprites";
const grid=document.getElementById("grid");
const status=document.getElementById("status");
const search=document.getElementById("search");
let sprites=[];
let filter="all";
let saved={};
try{saved=JSON.parse(localStorage.getItem("mySprites")||"{}")}catch(e){}
function store(){localStorage.setItem("mySprites",JSON.stringify(saved))}
function imageOf(s){
 const candidates=[
 s.image,s.icon,s.artwork,s.images?.icon,
 s.images?.large,s.images?.small,
 s.images?.render,s.displayImage,
 s.variants?.[0]?.image,s.variants?.[0]?.icon
 ];
 const found=candidates.find(x=>typeof x==="string"&&x.startsWith("http"));
 return found||"";
}
function normalize(data){
 const list=Array.isArray(data)?data:
 Array.isArray(data.sprites)?data.sprites:
 Array.isArray(data.data)?data.data:
 Array.isArray(data.items)?data.items:[];
 return list.flatMap(s=>{
 const variants=Array.isArray(s.variants)&&s.variants.length?s.variants:[s];
 return variants.map((v,i)=>({
 id:String(v.id||v.mappingId||s.id||s.mappingId||s.name+"-"+i),
 name:String(v.name||v.displayName||s.name||s.displayName||"Sprite"),
 image:imageOf(v)||imageOf(s)
 }));
 });
}
function render(){
 const q=search.value.toLowerCase();
 const shown=sprites.filter(s=>
 s.name.toLowerCase().includes(q)&&
 (filter==="all"||(filter==="owned"?!!saved[s.id]:!saved[s.id]))
 );
 grid.replaceChildren();
 for(const s of shown){
 const owned=!!saved[s.id];
 const card=document.createElement("article");
 card.className="card";
 const pic=document.createElement("div");
 pic.className="picture"+(owned?"":" missing");
 if(s.image){
 const img=document.createElement("img");
 img.src=s.image;img.alt=s.name;img.loading="lazy";
 pic.appendChild(img);
 }
 const details=document.createElement("div");
 details.className="details";
 const name=document.createElement("div");
 name.className="name";name.textContent=s.name;
 const level=document.createElement("div");
 level.className="level";
 level.textContent=owned?"Level "+saved[s.id]:"Not collected";
 details.append(name,level);
 if(owned){
 const controls=document.createElement("div");
 controls.className="controls";
 const minus=document.createElement("button");
 minus.textContent="−";
 const plus=document.createElement("button");
 plus.textContent="+";
 minus.onclick=()=>{saved[s.id]=Math.max(1,saved[s.id]-1);store();render()};
 plus.onclick=()=>{saved[s.id]++;store();render()};
 controls.append(minus,plus);
 details.appendChild(controls);
 }
 const button=document.createElement("button");
 button.className="own"+(owned?" yes":"");
 button.textContent=owned?"✓ Owned — Remove":"+ Mark Owned";
 button.onclick=()=>{
 if(owned)delete saved[s.id];
 else saved[s.id]=1;
 store();render();
 };
 details.appendChild(button);
 card.append(pic,details);
 grid.appendChild(card);
 }
 const count=sprites.filter(s=>saved[s.id]).length;
 document.getElementById("count").textContent=count+" / "+sprites.length;
 document.getElementById("fill").style.width=
 (sprites.length?count/sprites.length*100:0)+"%";
 status.textContent=shown.length?"": "No Sprites to display.";
}
document.querySelectorAll("[data-filter]").forEach(button=>{
 button.onclick=()=>{
 filter=button.dataset.filter;
 document.querySelectorAll("[data-filter]").forEach(b=>b.classList.remove("selected"));
 button.classList.add("selected");
 render();
 };
});
search.addEventListener("input",render);
fetch(API)
 .then(r=>{if(!r.ok)throw Error("API unavailable");return r.json()})
 .then(data=>{
 sprites=normalize(data);
 if(!sprites.length)throw Error("Unexpected API response");
 render();
 })
 .catch(()=>{
 status.textContent="Could not load Sprites. The API may be unavailable or blocking browser requests.";
 });
</script>
</body>
</html>
