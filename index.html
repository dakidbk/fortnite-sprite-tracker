
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortnite Sprite Tracker — Families</title>
<style>
:root{color-scheme:dark;--bg:#080d19;--surface:#121d31;--surface2:#1b2941;--border:rgba(166,205,255,.14);--text:#f5f9ff;--muted:#9caecb;--accent:#60e3ff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse 120% 400px at 50% -80px,#1b3c64 0%,transparent 75%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{position:relative;overflow:hidden;text-align:left;padding:36px 20px 28px;background:linear-gradient(130deg,#172b49 0%,#0d1628 72%);border-bottom:1px solid var(--border)}
header:after{content:"✦";position:absolute;right:-5px;top:-20px;font-size:170px;color:rgba(95,226,255,.065);pointer-events:none}
h1{position:relative;z-index:1;font-size:clamp(26px,7vw,40px);font-weight:950;letter-spacing:-1.5px;color:#f7fcff;margin:0;line-height:1.05}
h1::first-letter{color:var(--accent)}
header p{position:relative;z-index:1;color:#a9bed8;font-size:13px;margin:12px 0 0;letter-spacing:.25px}
main{max-width:780px;margin:auto;padding:22px 16px 64px}
.season-label{font-size:11px;letter-spacing:1.7px;color:#80dff6;margin:0 0 10px;font-weight:850}
#seasonSelect{appearance:none;width:100%;padding:17px 45px 17px 17px;margin-bottom:20px;background:linear-gradient(145deg,#1b2d4a,#132138);border:1px solid #365572;border-radius:16px;color:white;font-size:15px;font-weight:800;box-shadow:0 8px 22px #0003}
.panel{position:relative;overflow:hidden;background:linear-gradient(130deg,#1d3657,#142238 80%);border:1px solid rgba(119,206,255,.25);border-radius:23px;padding:23px;margin-bottom:22px;box-shadow:0 12px 36px #0004}
.panel:before{content:"";position:absolute;top:-90px;right:-70px;width:210px;height:210px;border-radius:50%;background:#4ddaff;filter:blur(95px);opacity:.14}
.panel>div:first-child{font-size:13px;color:#c5d8ef;font-weight:750;letter-spacing:.5px}
.big{font-size:clamp(38px,11vw,52px);letter-spacing:-2px;font-weight:950;color:#71e8ff;margin:8px 0 18px;font-variant-numeric:tabular-nums}
.bar{height:10px;background:#33445f;border-radius:20px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,#4bb7ff,#70f3ed);width:0;box-shadow:0 0 18px #4be8ff80;transition:width .25s}
.small{font-size:12px;color:var(--muted)}
.panel .small{margin:13px 0 0}
input{width:100%;padding:16px 17px;background:#17243a;border:1px solid #344963;border-radius:15px;color:white;font-size:16px;margin-bottom:15px;outline:none}
input:focus{border-color:#64dffb;box-shadow:0 0 0 3px #60e3ff1a}
input::placeholder{color:#8399b8}
.filters{display:flex;gap:9px;margin-bottom:25px;padding:4px;border:1px solid #253650;background:#111d30;border-radius:16px}
.filters button{flex:1;min-width:0;background:transparent;border:0;color:#aebed7;padding:13px 4px;border-radius:12px;font-weight:750;font-size:13px}
.filters .active{background:linear-gradient(135deg,#65e6ff,#49bfff);color:#061424;box-shadow:0 5px 16px #00bbff35}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:linear-gradient(180deg,#1c2a43,#131f32);border:1px solid var(--border);border-radius:19px;overflow:hidden;cursor:pointer;box-shadow:0 9px 25px #0004;transition:transform .16s,border-color .16s}
.card:active{transform:scale(.975);border-color:#62dfff}
.art{height:clamp(145px,43vw,235px);background:radial-gradient(circle at 50% 43%,#385779,#192d48 57%,#101b2e);display:flex;align-items:center;justify-content:center;padding:9px}
.art img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 16px #0006)}
.card-body{padding:14px 13px 15px}
.card-name{font-size:15px;line-height:1.25;font-weight:850;min-height:38px;letter-spacing:-.3px}
.count{font-size:26px;font-weight:950;letter-spacing:-.7px;color:#71e8ff;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.mini{height:6px;background:#33435a;border-radius:10px;overflow:hidden;margin:12px 0}
.mini div{height:100%;background:linear-gradient(90deg,#4abfff,#77f2e6);border-radius:10px}
.view{width:100%;border:1px solid #3e627e;border-radius:11px;background:#253e5c;color:#e6f9ff;padding:12px 6px;margin-top:4px;font-size:12px;font-weight:850}
#detail{display:none;position:fixed;inset:0;background:radial-gradient(circle at top,#1a3454,#080d19 60%);z-index:10;overflow-y:auto;padding:20px 16px 55px}
#detailContent{max-width:680px;margin:auto}
#detailContent h2{font-size:25px;letter-spacing:-.7px}
.back{background:#1e334e;color:#eaf7ff;border:1px solid #42607e;padding:13px 17px;border-radius:13px;margin-bottom:22px;font-weight:800}
.detail-art{height:210px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#35587a,#14223a 70%);border:1px solid var(--border);border-radius:20px;margin-bottom:20px}
.detail-art img{height:95%;max-width:100%;object-fit:contain;filter:drop-shadow(0 14px 20px #0006)}
.variant{display:flex;align-items:center;gap:11px;background:#17263e;border:1px solid var(--border);padding:12px;border-radius:15px;margin:10px 0}
.variant img{width:63px;height:69px;object-fit:contain;background:#253d5b;border-radius:11px}
.variant-info{flex:1;min-width:0}
.variant-name{font-weight:850;font-size:13px;overflow-wrap:anywhere}
.variant button{border:0;background:#66e4ff;color:#091728;border-radius:10px;padding:10px;font-weight:850;font-size:12px}
.variant button.owned{background:#22574e;color:#a3ffe1}
.level-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px}
.level-row button{padding:5px 10px;background:#334f6d;color:white}
.mastered-tag{display:inline-block;margin:7px 0 2px;color:#f8d988;font-size:11px;font-weight:850;letter-spacing:.2px}
.master-btn{display:block;margin-top:9px!important;padding:8px 10px!important;background:#283b56!important;color:#d6e5f7!important;border:1px solid #526782!important}
.master-btn.is-mastered{background:linear-gradient(135deg,#725522,#a27a2c)!important;color:#fff1b4!important;border-color:#e1b75a!important}
.level-summary{display:block;margin-top:5px;font-size:11px;color:#aac4dc}
.variant-level{display:inline-block;margin-top:8px;padding:5px 9px;background:#284666;border:1px solid #42698c;border-radius:8px;color:#a9edff;font-size:12px;font-weight:850}
.sync-wrap{display:flex;gap:10px;align-items:center;margin:0 0 18px}
#syncButton{flex:1;border:1px solid #5ad6fa;background:linear-gradient(130deg,#56e4ff,#3baff4);color:#061628;font-weight:900;border-radius:14px;padding:14px 16px;font-size:14px}
#syncButton:disabled{opacity:.65}
#syncStatus{font-size:11px;color:#b7c8e3;max-width:170px}
#syncTrack{display:none;position:fixed;left:0;right:0;bottom:40px;z-index:30;pointer-events:none;height:75px;overflow:hidden}
#runner{position:absolute;left:0;bottom:5px;width:62px;height:62px;object-fit:contain;animation:runSprite 2.1s linear infinite;filter:drop-shadow(0 5px 8px #0008)}
@keyframes runSprite{0%{transform:translateX(-80px) rotate(-12deg)}50%{transform:translateX(50vw) rotate(12deg)}100%{transform:translateX(calc(100vw + 80px)) rotate(-12deg)}}
.message{text-align:center;color:#b7c8e3;padding:20px 0}
@media(min-width:640px){header{padding-left:max(24px,calc((100vw - 740px)/2))}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<header>
<h1>✦ SPRITE TRACKER</h1>
<p>YOUR COLLECTION · EVERY VARIANT · EVERY SEASON</p>
</header>
<main>
<div class="sync-wrap"><button id="syncButton" type="button">↻ Refresh Sprites</button><span id="syncStatus" role="status" aria-live="polite">Account sync not connected</span></div>
<div class="season-label">SPRITE SEASON</div>
<select id="seasonSelect" aria-label="Choose Sprite season"><option value="all">All seasons</option></select>
<div class="panel">
<div>My Collection</div>
<div class="big" id="total">0 / 0</div>
<div class="bar"><div id="progress"></div></div>
<p class="small" id="families">0 completed families</p>
</div>
<input id="search" placeholder="Search Sprite families...">
<div class="filters">
<button class="active" data-filter="all">All</button>
<button data-filter="owned">Owned</button>
<button data-filter="missing">Missing</button>
</div>
<div id="message" class="message">Loading Sprites...</div>
<div id="grid" class="grid"></div>
<footer style="text-align:center;padding:4px 18px 30px;color:#9caecb;font-size:12px"><a href="./privacy.html" style="color:#71e8ff">Privacy Policy</a> · Independent fan-made tracker, not affiliated with Epic Games</footer>
</main>
<div id="syncTrack" aria-hidden="true"><img id="runner" alt=""></div>
<section id="detail">
<button class="back" id="back">← Back to Sprites</button>
<div id="detailContent"></div>
</section>
<script>
const API="https://prod.fn-api.cc/v1/sprites";
let refreshing=false;
let families=[],filter="all",selected=null,season="all";
let saved={};
let mastered={};
try{mastered=JSON.parse(localStorage.getItem("masteredSprites")||"{}")}catch(e){}
try{
 saved=JSON.parse(localStorage.getItem("mySprites")||"{}");
}catch(e){}
const $=id=>document.getElementById(id);
const imageOf=s=>{
 const choices=[
 s.image,s.icon,s.artwork,s.displayImage,
 s.images?.icon,s.images?.large,
 s.images?.small,s.images?.render
 ];
 return choices.find(x=>typeof x==="string"&&x.startsWith("http"))||"";
};
function store(){
 localStorage.setItem("mySprites",JSON.stringify(saved));
}
function familyName(s){
 const full=String(s.name||s.displayName||s.id||"Sprite").trim();
 const stem=full.replace(/\s+Sprite$/i,"").trim();
 // Variants commonly have a style prefix, e.g. Gummy Llama, Galaxy Llama.
 // Use the last family word so they all appear under Llama Sprite.
 const words=stem.split(/\s+/);
 return words[words.length-1]||stem;
}
function getList(data){
 if(Array.isArray(data))return data;
 for(const x of [data.sprites,data.data,data.items,data.families]){
 if(Array.isArray(x))return x;
 }
 return [];
}
function seasonOf(s,v){
 // Never infer a season from a Sprite's name or current calendar date.
 const values=[v.season,s.season,v.introduction?.season,s.introduction?.season,
 v.introduced?.season,s.introduced?.season,v.releaseSeason,s.releaseSeason,
 v.battlePassSeason,s.battlePassSeason,v.chapterSeason,s.chapterSeason];
 for(const value of values){
  if(value===null||value===undefined||value==="")continue;
  if(typeof value==="object"){
   const name=value.displayName||value.name||value.label||value.id;
   if(name)return String(name);
  }else if(typeof value==="string"||typeof value==="number")return String(value);
 }
 return "Season unknown";
}
function prepare(data){
 const map=new Map();
 for(const s of getList(data)){
  const base=familyName(s);
  const variants=Array.isArray(s.variants)&&s.variants.length?s.variants:[s];
  variants.forEach((v,i)=>{
   const seasonName=seasonOf(s,v);
   // Family identity includes season: older variants never enter newer season cards.
   const key=seasonName+"::"+base.toLowerCase();
   if(!map.has(key))map.set(key,{
    name:base+" Sprite",season:seasonName,
    image:imageOf(s)||imageOf(v),variants:[]
   });
   const family=map.get(key);
   const id=String(v.id||v.mappingId||s.id||s.mappingId||key+"-"+i);
   const variantName=String(v.displayName||v.name||s.displayName||s.name||("Variant "+(i+1)));
   if(family.variants.some(item=>item.id===id))return;
   family.variants.push({id,name:variantName,image:imageOf(v)||imageOf(s)});
  });
 }
 return [...map.values()];
}
function setupSeasons(){
 const select=$("seasonSelect");
 const names=[...new Set(families.map(f=>f.season))].sort((a,b)=>{
  if(a==="Season unknown")return 1;
  if(b==="Season unknown")return -1;
  return b.localeCompare(a,undefined,{numeric:true});
 });
 select.replaceChildren();
 const all=document.createElement("option");
 all.value="all";all.textContent="All seasons (combined)";
 select.append(all);
 for(const name of names){
  const option=document.createElement("option");
  option.value=name;option.textContent=name;
  select.append(option);
 }
 const known=names.filter(n=>n!=="Season unknown");
 // Prefer a known season when one exists, to avoid mixing older and newer Sprites.
 season=known[0]||names[0]||"all";
 select.value=season;
}
function owned(v){return !!saved[v.id]}
function isMastered(v){return owned(v)&&!!mastered[v.id]}
function saveMastery(){localStorage.setItem("masteredSprites",JSON.stringify(mastered))}
function amount(f){return f.variants.filter(owned).length}
function totals(){
 const visibleFamilies=families.filter(f=>season==="all"||f.season===season);
 const all=visibleFamilies.flatMap(f=>f.variants);
 const n=all.filter(owned).length;
 $("total").textContent=n+" / "+all.length;
 $("progress").style.width=(all.length?n/all.length*100:0)+"%";
 const complete=visibleFamilies.filter(f=>amount(f)===f.variants.length).length;
 $("families").textContent=complete+" / "+visibleFamilies.length+" families completed";
}
function makeImage(src,alt){
 const img=document.createElement("img");
 img.src=src;
 img.alt=alt;
 img.loading="lazy";
 return img;
}
function render(){
 totals();
 const q=$("search").value.toLowerCase();
 const list=families.filter(f=>{
 if(season!=="all"&&f.season!==season)return false;
 const n=amount(f),total=f.variants.length;
 return f.name.toLowerCase().includes(q)&&
 (filter==="all"||
 (filter==="owned"&&n>0)||
 (filter==="missing"&&n<total));
 });
 $("grid").replaceChildren();
 $("message").textContent=list.length?"":"No Sprite families found.";
 for(const f of list){
 const n=amount(f),total=f.variants.length;
 const card=document.createElement("article");
 card.className="card";
 const art=document.createElement("div");
 art.className="art";
 if(f.image)art.append(makeImage(f.image,f.name));
 const body=document.createElement("div");
 body.className="card-body";
 const title=document.createElement("div");
 title.className="card-name";
 title.textContent=f.name;
 const count=document.createElement("div");
 count.className="count";
 count.textContent=n+" / "+total;
 const sub=document.createElement("div");
 sub.className="small";
 sub.textContent=n===total?"✓ Complete":"Rarities collected";
 const mastery=document.createElement("div");
 mastery.className="mastered-tag";
 mastery.textContent="★ "+f.variants.filter(isMastered).length+" mastered";
 const highest=f.variants.filter(owned).reduce((m,v)=>Math.max(m,Number(saved[v.id])||0),0);
 const levelSummary=document.createElement("span");
 levelSummary.className="level-summary";
 levelSummary.textContent=highest?"Highest level: "+highest:"No levels recorded";
 const mini=document.createElement("div");
 mini.className="mini";
 const fill=document.createElement("div");
 fill.style.width=(n/total*100)+"%";
 mini.append(fill);
 const button=document.createElement("button");
 button.className="view";
 button.textContent="Explore variants →";
 body.append(title,count,sub,mastery,levelSummary,mini,button);
 card.append(art,body);
 card.onclick=()=>openFamily(f);
 $("grid").append(card);
 }
}
function openFamily(f){
 selected=f;
 $("detail").style.display="block";
 document.body.style.overflow="hidden";
 showFamily();
}
function showFamily(){
 const f=selected;
 const root=$("detailContent");
 root.replaceChildren();
 const seasonTag=document.createElement("p");
 seasonTag.className="small";seasonTag.textContent=f.season;
 root.append(seasonTag);
 const h=document.createElement("h2");
 h.textContent=f.name+" — "+amount(f)+"/"+f.variants.length;
 root.append(h);
 const art=document.createElement("div");
 art.className="detail-art";
 if(f.image)art.append(makeImage(f.image,f.name));
 root.append(art);
 for(const v of f.variants){
 const row=document.createElement("div");
 row.className="variant";
 if(v.image)row.append(makeImage(v.image,v.name));
 const info=document.createElement("div");
 info.className="variant-info";
 const name=document.createElement("div");
 name.className="variant-name";
 name.textContent=v.name;
 info.append(name);
 const levelBadge=document.createElement("div");
 levelBadge.className="variant-level";
 levelBadge.textContent=owned(v)?"LVL "+saved[v.id]:"LVL — · Missing";
 info.append(levelBadge);
 if(owned(v)){
 const levels=document.createElement("div");
 levels.className="level-row";
 const minus=document.createElement("button");
 minus.textContent="−";
 const label=document.createElement("span");
 label.textContent="Level "+saved[v.id];
 const plus=document.createElement("button");
 plus.textContent="+";
 minus.onclick=()=>{
 saved[v.id]=Math.max(1,saved[v.id]-1);
 store();showFamily();render();
 };
 plus.onclick=()=>{
 saved[v.id]++;
 store();showFamily();render();
 };
 levels.append(minus,label,plus);
 info.append(levels);
 const masterButton=document.createElement("button");
 masterButton.className="master-btn"+(isMastered(v)?" is-mastered":"");
 masterButton.textContent=isMastered(v)?"★ Mastered":"☆ Mark Mastered";
 masterButton.onclick=()=>{
 if(isMastered(v))delete mastered[v.id];
 else mastered[v.id]=true;
 saveMastery();showFamily();render();
 };
 info.append(masterButton);
 }
 const button=document.createElement("button");
 button.className=owned(v)?"owned":"";
 button.textContent=owned(v)?"✓ Owned":"+ Add";
 button.onclick=()=>{
 if(owned(v)){delete saved[v.id];delete mastered[v.id];saveMastery();}
 else saved[v.id]=1;
 store();showFamily();render();
 };
 row.append(info,button);
 root.append(row);
 }
}
$("back").onclick=()=>{
 $("detail").style.display="none";
 document.body.style.overflow="";
 selected=null;
};
$("search").oninput=render;
$("seasonSelect").onchange=e=>{season=e.target.value;render();};
document.querySelectorAll("[data-filter]").forEach(b=>{
 b.onclick=()=>{
 filter=b.dataset.filter;
 document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");
 render();
 };
});
async function refreshSprites(isManual=false){
 if(refreshing)return;
 refreshing=true;
 const button=$("syncButton");
 button.disabled=true;
 button.textContent="Refreshing…";
 const runner=$("runner");
 const sample=families.flatMap(f=>f.variants).find(v=>v.image);
 if(sample)runner.src=sample.image;
 $("syncTrack").style.display=isManual?"block":"none";
 $("syncStatus").textContent="Checking Sprite catalog…";
 const start=Date.now();
 try{
  const response=await fetch(API+"?refresh="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw Error("Catalog request failed");
  const data=await response.json();
  const updated=prepare(data);
  if(!updated.length)throw Error("No Sprites returned");
  families=updated;
  const previousSeason=season;
  setupSeasons();
  if([...$("seasonSelect").options].some(o=>o.value===previousSeason)){
   season=previousSeason;$("seasonSelect").value=season;
  }
  render();
  if(selected){
   const matching=families.find(f=>f.name===selected.name&&f.season===selected.season);
   if(matching){selected=matching;showFamily();}
  }
  if(isManual)await new Promise(resolve=>setTimeout(resolve,Math.max(0,2100-(Date.now()-start))));
  $("syncStatus").textContent="✓ Sprite catalog updated · Account not connected";
 }catch(error){
  $("syncStatus").textContent="Could not refresh Sprites. Try again.";
  if(!families.length)$("message").textContent="Could not load Sprite data. Please try refreshing.";
 }finally{
  $("syncTrack").style.display="none";
  button.disabled=false;
  button.textContent="↻ Refresh Sprites";
  refreshing=false;
 }
}
$("syncButton").onclick=()=>refreshSprites(true);
refreshSprites(false);
</script>
</body>
</html>
